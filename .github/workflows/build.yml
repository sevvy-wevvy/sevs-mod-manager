name: build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64}
          - {os: ubuntu-22.04-arm, name: linux-arm64}
          - {os: macos-latest, name: mac-arm64}
          - {os: macos-latest, name: mac-x64, cc: clang -arch x86_64}
          - {os: windows-latest, name: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tests
        if: runner.os != 'Windows' && matrix.name != 'mac-x64'
        shell: bash
        run: sh tests/run.sh
      - name: build
        shell: bash
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            CC=gcc ./build.sh win
            cp build-win/smm.exe smm-${{ matrix.name }}.exe
          else
            ./build.sh
            cp build/smm smm-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: smm-${{ matrix.name }}
          path: smm-${{ matrix.name }}*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "Sevs Mod Manager $GITHUB_REF_NAME" --notes "Sevs Mod Manager $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
