name: build
on:
  push:
    branches: [dev, beta, main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x64}
          - {os: ubuntu-24.04-arm, name: linux-arm64}
          - {os: macos-latest, name: mac-arm64}
          - {os: macos-13, name: mac-x64}
          - {os: windows-latest, name: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tests
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/run.sh
      - name: build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            CC=gcc ./build.sh win
            cp build-win/smm.exe smm-${{ matrix.name }}.exe
          else
            ./build.sh
            cp build/smm smm-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: smm-${{ matrix.name }}
          path: smm-${{ matrix.name }}*
  publish:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev-latest
          git push -f origin dev-latest
          gh release view dev-latest >/dev/null 2>&1 || gh release create dev-latest --prerelease --target dev --title "dev build" --notes "newest build from the dev branch"
          gh release upload dev-latest dist/* --clobber
